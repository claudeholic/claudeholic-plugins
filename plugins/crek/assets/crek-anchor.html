<!DOCTYPE html>
<!-- CREK scan anchor: the first tab of a job scan's browser window (skills/job-scan, "One browser
     window per scan"). It holds the window open while agents work in it, so it says so in large
     letters. Self-contained: no scripts, no external resources. Colours from the CREK web app
     (assets/crek-php/index.php), dark or light after the system setting. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>CREK Anchor — do not close</title>
<style>
:root { --bg:#0f1117; --text:#e2e4eb; --text2:#8b8fa3; --accent:#6c8cff; }
@media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f9; --text:#1c2030; --text2:#5b6074; --accent:#3d5bd9; }
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4vh; padding:5vw; text-align:center;
    border-top:1.2vh solid var(--accent);
}
h1 { font-size:clamp(56px, 16vw, 240px); font-weight:800; letter-spacing:.04em; line-height:1; }
h1 span { color:var(--accent); }
h1 small { display:block; font-size:.38em; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-top:.3em; }
.warn { font-size:clamp(26px, 4.6vw, 72px); font-weight:700; line-height:1.2; max-width:22em; }
.pl { font-size:clamp(18px, 2.6vw, 40px); color:var(--text2); line-height:1.3; max-width:30em; }
</style>
</head>
<body>
<h1><span>C</span>REK<small>Anchor</small></h1>
<p class="warn">Do not close this page while CREK agents are working for you.</p>
<p class="pl" lang="pl">Nie zamykaj tej strony, gdy agenci CREK pracują dla Ciebie.</p>
</body>
</html>
